<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bearded Audio — Ian Tomlinson, freelance audio editor</title>
<meta name="description" content="Freelance audio editor and sound designer. Podcasts, audiobooks, game audio, ASMR and music. Press start.">
<meta name="theme-color" content="#140e26">

<meta property="og:title" content="Bearded Audio">
<meta property="og:description" content="Freelance audio editor and sound designer. Podcasts, audiobooks, game audio, ASMR and music.">
<meta property="og:type" content="website">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎧</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">

<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

<!-- ══ CRT overlay ═══════════════════════════════════════════════ -->
<div id="crt" aria-hidden="true">
  <div class="crt-roll"></div>
  <div class="crt-glow"></div>
  <div class="crt-vignette"></div>
</div>

<!-- ══ Boot / title screen ═══════════════════════════════════════ -->
<div id="boot" hidden>
  <div class="boot-inner">
    <div class="boot-logo" aria-hidden="true">
      <span>BEARDED</span>
      <span>AUDIO</span>
    </div>
    <p class="boot-tag">AUDIO EDITING &amp; SOUND DESIGN &amp; MUSIC &amp; ASMR</p>
    <button id="boot-start" class="boot-start" type="button">PRESS START</button>
  </div>
</div>

<a href="#main" class="skip-link">Skip to content</a>

<!-- ══ Shell ═════════════════════════════════════════════════════ -->
<div id="shell">

  <header id="hud">
    <div class="hud-inner">
      <a href="#/home" class="logo" id="logo">
        <span class="logo-mark" id="logo-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="logo-text">BEARDED AUDIO</span>
      </a>

      <nav id="nav" aria-label="Sections"></nav>

      <div class="hud-tools">
        <a href="#/trophies" class="tool" id="tool-trophies" title="Achievements">
          <span class="tool-count" id="trophy-count">0/0</span>
          <span class="sr-only">Achievements</span>
        </a>
        <button class="tool" id="tool-sound" type="button" aria-pressed="false" title="Toggle interface sound">
          <span class="tool-label" id="sound-label">SFX OFF</span>
        </button>
        <button class="tool" id="tool-crt" type="button" aria-pressed="true" title="Toggle CRT effect">
          <span class="tool-label" id="crt-label">CRT ON</span>
        </button>
        <button class="tool tool-menu" id="tool-menu" type="button" aria-expanded="false" aria-controls="nav" title="Menu">
          <span class="burger" aria-hidden="true"></span>
          <span class="sr-only">Menu</span>
        </button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <div id="screen"></div>
  </main>

  <footer id="foot">
    <p class="foot-line">© <span id="year"></span> BEARDED AUDIO</p>
    <p class="foot-sub">Audio Editing &amp; Sound Design &amp; Music &amp; ASMR</p>
  </footer>
</div>

<!-- ══ Toasts ════════════════════════════════════════════════════ -->
<div id="toasts" aria-live="polite" aria-atomic="false"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/audio.js"></script>
<script src="assets/js/achievements.js"></script>
<script src="assets/js/player.js"></script>
<script src="assets/js/deck.js"></script>
<script src="assets/js/minigame.js"></script>
<script src="assets/js/views.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
